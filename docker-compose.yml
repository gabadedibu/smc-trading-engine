services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: smc
      POSTGRES_PASSWORD: smc_password
      POSTGRES_DB: smc_trading
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - '3001:3001'
      - '8080:8080'
    env_file:
      - .env
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  postgres_data:
